# Hosts treated as tracking or advertising when contacted before the visitor
# has interacted with any consent interface.
#
#   domain       matches the host itself and any subdomain
#   path_prefix  optional; only requests whose path starts with this match
#   action       fail   -> the request itself is a tracking/advertising beacon
#                review -> a loader or tag manager; legitimate if it waits for consent
#
# Add entries by pull request. Please include a public source showing the host
# is used for analytics, advertising or behavioural tracking.

