[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "dpdp-kit"
version = "0.1.0"
description = "Open-source self-assessment kit for India's Digital Personal Data Protection Act, 2023 and DPDP Rules, 2025"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["dpdp", "privacy", "consent", "compliance", "india", "self-assessment"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Intended Audience :: Legal Industry",
  "Intended Audience :: Developers",
]
dependencies = [
  "PyYAML>=6",
  "Jinja2>=3.1",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
web = ["playwright>=1.40"]
dev = [
  "playwright>=1.40",
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
  "types-jsonschema",
  "pip-audit>=2.7",
  "pre-commit>=3.7",
]

[project.scripts]
dpdp-kit = "dpdp_kit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dpdp_kit"]

# The catalogue and profiles live at the repository root (they are CC-BY-4.0,
# the code is Apache-2.0). They are bundled into the wheel at build time.
[tool.hatch.build.targets.wheel.force-include]
"catalogue" = "dpdp_kit/_data/catalogue"
"profiles" = "dpdp_kit/_data/profiles"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
markers = ["browser: needs a Playwright-controllable Chromium"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["dpdp_kit"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", 'if __name__ == "__main__":']

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F",   # pycodestyle, pyflakes
  "I",             # import order
  "B",             # bugbear
  "UP",            # pyupgrade
  "SIM",           # simplify
  "C4",            # comprehensions
  "PTH",           # pathlib
  "RET",           # return hygiene
  "PL",            # pylint subset
  "S",             # bandit security
  "BLE",           # blind except
  "TRY",           # exception hygiene
  "RUF",
]
ignore = [
  "PLR2004",  # magic values are fine in tests and small thresholds
  "TRY003",   # long messages in exceptions are intentional: they are user-facing
  "PLR0913",  # CLI/report builders legitimately take several args
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "PLR2004", "PLC0415"]
# Catch-all handlers at plugin/check boundaries are deliberate (PY-004, GEN-006).
"src/dpdp_kit/engine.py" = ["BLE001"]
"src/dpdp_kit/registry.py" = ["BLE001"]
"src/dpdp_kit/context.py" = ["BLE001"]
"src/dpdp_kit/plugins/web_scan/snapshot.py" = ["BLE001", "PLC0415"]

[tool.mypy]
strict = true
python_version = "3.10"
mypy_path = "src"
files = ["src/dpdp_kit"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["playwright.*"]
ignore_missing_imports = true
