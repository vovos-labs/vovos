<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Fixture: "Accept only necessary" is a decline option</title></head>
<body>
<h1>Necessary-only wording</h1>
<!-- "Accept only necessary" starts with "Accept" but means decline; it must be classed as reject, not accept. -->
<div class="cmp-banner" style="position:fixed;bottom:0;left:0;right:0;background:#eee;padding:12px">
  <p>We use cookies. <a href="/cookie-policy">Cookie policy</a></p>
  <button>Accept all cookies</button>
  <button>Accept only necessary</button>
</div>
</body>
</html>
